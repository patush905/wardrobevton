[project]
name = "ai-wardrobe"
version = "0.1.0"
requires-python = ">=3.11"

# The website + API only. Nothing heavy - no torch, no diffusers.
# Those live in modal_app/requirements.txt and are installed into the Modal
# image, never here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "supabase>=2.10",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
